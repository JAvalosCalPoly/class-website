<p>
  A <b>lattice</b> is an algebraic structure \((L, \land, \lor)\) where \(\land,\lor\colon L \times L \to L\) are commutative and associative, and they satisfy the following axioms for all elements \(a, b \in L\):
  \begin{align*}
    a \lor (a \land b) &= a
    \\
    a \land (a \lor b) &= a
  \end{align*}
</p>
